name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  verify:
    name: Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Public Structure
        run: |
          test -f public/index.html || exit 1
          test -f public/404.html || exit 1
          test -f public/_headers || exit 1
          test -f public/_redirects || exit 1
          echo "All apex domain routing assets verified successfully."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify hub landing
        run: node --test test/hub.test.mjs
